name: osc-manual

# Dispatch wrapper: runs this repository's CI job steps against an arbitrary
# ref. Lives on the fork's default branch only, because GitHub reads
# workflow_dispatch triggers from the default branch.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Ref to check out and test
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Report checked-out SHA
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          echo "checked-out ref: $TARGET_REF"
          echo "checked-out SHA: $(git rev-parse HEAD)"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run tests
        run: npm test
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out django-orm-lens.vsix

  python-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0", "5.1", "5.2"]
        exclude:
          - python-version: "3.10"
            django-version: "5.2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Report checked-out SHA
        run: echo "checked-out SHA: $(git rev-parse HEAD)"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI + test extras
        working-directory: cli
        run: |
          pip install -e ".[dev]"
          pip install "Django==${{ matrix.django-version }}.*"
      - name: Run pytest
        working-directory: cli
        run: python -m pytest -q

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Report checked-out SHA
        run: echo "checked-out SHA: $(git rev-parse HEAD)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + lint tools
        working-directory: cli
        run: pip install -e ".[dev]"
      - name: ruff
        working-directory: cli
        run: python -m ruff check django_orm_lens tests
      - name: mypy
        working-directory: cli
        run: python -m mypy django_orm_lens
